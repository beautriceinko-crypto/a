<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Liquid Glass iPhone Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone" id="phone">
    <div class="wallpaper"></div>
    <div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div>

    <header class="status">
      <span id="time">9:41</span>
      <div class="status-icons"><span>▮▮▮</span><span>⌁</span><span class="battery">▰</span></div>
    </header>

    <section class="hero glass" id="hero">
      <div class="hero-top"><span>Tuesday, September 6</span><button id="focusBtn" aria-label="Focus mode">☾</button></div>
      <div class="clock" id="clock">9:41</div>
      <div class="hero-bottom"><span>Cupertino</span><span id="weather">24° · Clear</span></div>
    </section>

    <section class="grid" id="appGrid" aria-label="Apps"></section>

    <section class="dock glass" id="dock"></section>
    <div class="home-indicator"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
